[project]
name = "backend"
version = "0.2.0"
description = "AI Learning Tutor API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "supabase>=2.33.0",
    # CPU-only PyTorch – avoids the multi-GB CUDA wheels.
    # Install with: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
